<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f9;
}

/* Navbar */
.navbar {
    background: #2c3e50;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
}

/* Container */
.container {
    width: 90%;
    margin: 20px auto;
}

/* Cards */
.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

/* Dashboard */
.dashboard {
    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.dashboard div {
    flex: 1;
    text-align: center;
    padding: 15px;
    border-radius: 8px;
    color: white;
}

.balance { background: #3498db; }
.income { background: #2ecc71; }
.expense { background: #e74c3c; }

/* Forms */
input, select, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button {
    background: #2c3e50;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #34495e;
}

/* List */
ul {
    list-style: none;
    padding: 0;
}

li {
    padding: 10px;
    margin-top: 5px;
    background: #ecf0f1;
    border-radius: 5px;
    display: flex;
    justify-content: space-between;
}
</style>
</head>

<body>

<div class="navbar">
    Expense Tracker Application
</div>

<div class="container">

    <!-- Dashboard -->
    <div class="card dashboard">
        <div class="balance">
            <h3>Balance</h3>
            <h2 id="balance">₹0</h2>
        </div>
        <div class="income">
            <h3>Total Income</h3>
            <h2 id="totalIncome">₹0</h2>
        </div>
        <div class="expense">
            <h3>Total Expense</h3>
            <h2 id="totalExpense">₹0</h2>
        </div>
    </div>

    <!-- Income Entry -->
    <div class="card">
        <h3>Add Income</h3>
        <input type="text" id="incomeDesc" placeholder="Income Source">
        <input type="number" id="incomeAmount" placeholder="Amount">
        <button onclick="addIncome()">Add Income</button>
    </div>

    <!-- Expense Entry -->
    <div class="card">
        <h3>Add Expense</h3>
        <input type="text" id="expenseDesc" placeholder="Expense Description">
        <input type="number" id="expenseAmount" placeholder="Amount">
        <select id="category">
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Bills</option>
            <option>Other</option>
        </select>
        <button onclick="addExpense()">Add Expense</button>
    </div>

    <!-- Expense List -->
    <div class="card">
        <h3>Transaction History</h3>
        <ul id="transactionList"></ul>
    </div>

    <!-- Chart -->
    <div class="card">
        <h3>Expense Overview</h3>
        <canvas id="expenseChart"></canvas>
    </div>

</div>

<script>
let totalIncome = 0;
let totalExpense = 0;
let categoryData = {
    Food: 0,
    Travel: 0,
    Shopping: 0,
    Bills: 0,
    Other: 0
};

function updateUI() {
    document.getElementById("totalIncome").innerText = "₹" + totalIncome;
    document.getElementById("totalExpense").innerText = "₹" + totalExpense;
    document.getElementById("balance").innerText = "₹" + (totalIncome - totalExpense);
    updateChart();
}

function addIncome() {
    const desc = document.getElementById("incomeDesc").value;
    const amount = parseFloat(document.getElementById("incomeAmount").value);
    if (!desc || !amount) return;

    totalIncome += amount;
    addTransaction(desc, amount, "Income");
    updateUI();
}

function addExpense() {
    const desc = document.getElementById("expenseDesc").value;
    const amount = parseFloat(document.getElementById("expenseAmount").value);
    const category = document.getElementById("category").value;
    if (!desc || !amount) return;

    totalExpense += amount;
    categoryData[category] += amount;
    addTransaction(desc + " (" + category + ")", -amount, "Expense");
    updateUI();
}

function addTransaction(desc, amount) {
    const li = document.createElement("li");
    li.innerHTML = `${desc} <span>₹${amount}</span>`;
    document.getElementById("transactionList").appendChild(li);
}

const ctx = document.getElementById('expenseChart').getContext('2d');
let expenseChart = new Chart(ctx, {
    type: 'pie',
    data: {
        labels: Object.keys(categoryData),
        datasets: [{
            data: Object.values(categoryData),
            backgroundColor: [
                '#f39c12',
                '#1abc9c',
                '#9b59b6',
                '#e67e22',
                '#95a5a6'
            ]
        }]
    }
});

function updateChart() {
    expenseChart.data.datasets[0].data = Object.values(categoryData);
    expenseChart.update();
}
</script>

</body>
</html>
